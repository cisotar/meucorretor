<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Correções</title>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<style>
  :root {
    --bg:        #cbcfd5;   /* fundo da página */
    --bg-side:   #b4b9c1;   /* sidebar */
    --surface:   #d4d7dc;   /* cards */
    --surface-2: color-mix(in srgb, var(--surface) 60%, white);   /* hover */
    --line:      color-mix(in srgb, var(--bg) 85%, black);
    --text:      #272c34;
    --muted:     #4e5560;
    --accent:    #5a6fd6;
    --accent-bg: #cfd6f3;
    --ok:        #3f8f63;
    --danger:    #c85a5a;
    --cc:        #5a6fd6;  --cc-bg: #cdd4f2;
    --cs:        #b27a2c;  --cs-bg: #ecdcc0;
    --radius:    14px;
    --shadow:    0 1px 2px rgba(40,48,60,.10), 0 6px 18px rgba(40,48,60,.08);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font-family: Inter, "Segoe UI", system-ui, -apple-system, sans-serif; line-height: 1.6; font-size: 15px;
         background: var(--bg); color: var(--text); overflow: hidden; display: flex; }
  button { font: inherit; color: inherit; cursor: pointer; }

  /* ---------- Sidebar ---------- */
  #sidebar { width: 320px; flex: none; height: 100vh; overflow-y: auto; border-right: 1px solid var(--line);
             background: var(--bg-side); padding: 1.1rem .9rem; transition: margin-left .25s; }
  body.colapsada #sidebar { margin-left: -320px; }
  #borda { flex: none; width: 16px; height: 100vh; padding: 0; border: 0; border-right: 1px solid var(--line); border-radius: 0;
           background: var(--bg-side); color: var(--muted); font-size: 1rem; font-weight: 700; line-height: 1; display: grid; place-items: center;
           transition: background .15s, color .15s; }
  #borda:hover, #borda:focus-visible { background: var(--accent); color: #fff; outline: none; }
  #toggle { display: none; }
  #sidebar .marca { display: flex; align-items: center; gap: .6rem; margin: 0 .3rem 1rem; }
  #sidebar .logo { width: 34px; height: 34px; border-radius: 10px; background: var(--accent); color: #eef0ff;
                   display: grid; place-items: center; font-weight: 700; box-shadow: var(--shadow); }
  #sidebar h1 { font-size: 1.1rem; margin: 0; letter-spacing: -.01em; }

  #sidebar details { margin-bottom: .6rem; background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
  #sidebar summary { cursor: pointer; padding: .7rem .9rem; font-weight: 600; list-style: none; display: flex; align-items: center; justify-content: space-between; }
  #sidebar summary::-webkit-details-marker { display: none; }
  #sidebar summary::after { content: "›"; transition: transform .2s; color: var(--muted); font-size: 1.2rem; }
  #sidebar details[open] > summary::after { transform: rotate(90deg); }
  /* Sanfonas de tema dentro de "Redações" */
  #sidebar details.tema-grupo { margin: 0 .4rem .4rem; background: var(--surface-2); box-shadow: none; border-radius: 10px; }
  #sidebar details.tema-grupo > summary { padding: .5rem .7rem; font-size: .85rem; gap: .5rem; }
  #sidebar details.tema-grupo > summary .tit { flex: 1; overflow-wrap: anywhere; }
  #sidebar details.tema-grupo > summary .qtd { flex: none; font-size: .72rem; color: var(--muted); background: var(--surface); border-radius: 999px; padding: 0 .5rem; }
  #sidebar details.tema-grupo ul { padding: 0 .2rem .4rem; }
  #lista-redacoes { padding-bottom: .1rem; }
  #lista-redacoes a .tema { display: none; }
  body.ocultar-lidas #lista-redacoes details.tema-grupo:not(:has(li:not(.conferida), li.atual)) { display: none; }
  #sidebar details ul { list-style: none; margin: 0; padding: 0 .4rem .5rem; }
  #sidebar details li a { display: flex; flex-direction: column; gap: .05rem; padding: .45rem .6rem; border-radius: 10px; color: var(--text);
                 text-decoration: none; font-size: .88rem; border-left: 3px solid transparent; }
  #sidebar details li a:hover { background: var(--surface-2); }
  #sidebar details li a.ativo { background: var(--accent-bg); border-left-color: var(--accent); }
  #sidebar details li a .linha1 { display: flex; align-items: baseline; gap: .45rem; }
  #sidebar details li a .num { color: var(--muted); font-weight: 600; font-variant-numeric: tabular-nums; flex: none; }
  #sidebar details li a .nome { font-weight: 600; overflow-wrap: anywhere; }
  #sidebar details li a .tag { margin-left: auto; flex: none; font-size: .62rem; font-weight: 700; padding: .05rem .4rem; border-radius: 6px; letter-spacing: .04em; background: var(--line); color: var(--muted); }
  #sidebar details li a .tag.CC { background: var(--cc-bg); color: var(--cc); } #sidebar details li a .tag.CS { background: var(--cs-bg); color: var(--cs); }
  #sidebar details li a .tema { color: var(--muted); font-size: .75rem; }
  #sidebar details ul.arq li a { font-weight: 600; overflow-wrap: anywhere; }
  #sidebar details li.conferida a .linha1::after { content: "✓"; color: var(--ok); font-weight: bold; flex: none; }

  #busca { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: .55rem .8rem;
           font: inherit; color: var(--text); margin-bottom: .7rem; outline: none; }
  #busca:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-bg); }
  #busca::placeholder { color: var(--muted); }
  #sidebar li.sem-busca, #sidebar details.sem-resultado { display: none !important; }
  #msg-busca { display: none; margin: .2rem .4rem; color: var(--muted); font-size: .85rem; }
  #msg-busca.mostrar { display: block; }
  #ocultar-lidas { display: inline-flex; align-items: center; margin: 0 0 .9rem; padding: .25rem .85rem; border: 1px solid var(--line);
                   border-radius: 999px; background: var(--surface); color: var(--muted); font-size: .8rem; font-weight: 600; cursor: pointer; }
  #ocultar-lidas:hover { background: var(--surface-2); }
  #ocultar-lidas[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #eef0ff; }
  #ocultar-lidas .estado { margin-left: .3rem; opacity: .85; }
  body.ocultar-lidas #lista-redacoes li.conferida:not(.atual) { display: none; }
  #msg-lidas { display: none; margin: .2rem .8rem .5rem; color: var(--muted); font-size: .85rem; }
  body.ocultar-lidas.todas-lidas #msg-lidas { display: block; }

  /* ---------- Área principal ---------- */
  #area { flex: 1; min-width: 0; height: 100vh; display: flex; flex-direction: column; }
  #topo { display: flex; align-items: center; flex-wrap: wrap; gap: .5rem; padding: .7rem 1.1rem;
          background: color-mix(in srgb, var(--bg) 80%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
  #toggle, #pendentes, #home, #imprimir { margin: 0; align-self: auto; padding: .4rem .9rem; border: 1px solid var(--line); background: var(--surface);
                               border-radius: 10px; font-size: .86rem; font-weight: 500; cursor: pointer; }
  #toggle:hover, #pendentes:hover, #home:hover, #imprimir:hover { background: var(--surface-2); }
  #pendentes .badge { display: inline-block; margin-left: .4rem; min-width: 1.3rem; padding: 0 .4rem; border-radius: 999px;
                      background: var(--danger); color: #f4eeee; font-size: .72rem; font-weight: 700; text-align: center; }
  #pendentes .badge.zero { background: var(--ok); }
  #pills { display: inline-flex; gap: .35rem; margin-left: .4rem; padding-left: .9rem; border-left: 1px solid var(--line); }
  #pills:empty { display: none; }
  #pills button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: .15rem .75rem; font-size: .8rem; font-weight: 600; color: var(--muted); }
  #pills button:hover { background: var(--accent-bg); color: var(--accent); border-color: var(--accent); }
  #pills button.topo { background: var(--text); border-color: var(--text); color: var(--surface); }
  #pills button.topo:hover { background: #3d444f; color: var(--surface); }

  #rolagem { flex: 1; overflow-y: auto; }
  #rolagem::after { content: ""; display: block; height: 85vh; }     /* folga para rolar até o fim */
  #conteudo { max-width: 960px; margin: 1.5rem auto 0; padding: 1.8rem 2rem 2rem; background: var(--surface);
              border-radius: var(--radius); box-shadow: var(--shadow); }
  #conteudo h1 { font-size: 1.7rem; letter-spacing: -.02em; margin-top: 0; }
  #conteudo h2 { font-size: 1.2rem; margin-top: 2rem; padding-bottom: .3rem; border-bottom: 1px solid var(--line); }
  #conteudo h3 { font-size: 1.02rem; }
  #conteudo hr { border: 0; border-top: 1px solid var(--line); margin: 1.5rem 0; }
  #conteudo blockquote { margin: 1rem 0; padding: .7rem 1rem; border-left: 3px solid var(--accent); background: var(--bg); border-radius: 0 10px 10px 0; color: var(--muted); }
  #conteudo blockquote p { margin: 0; }
  #conteudo code { background: var(--bg); border-radius: 5px; padding: .08rem .35rem; font-size: .88em; }
  #conteudo pre { background: var(--bg); border-radius: 10px; padding: .8rem 1rem; overflow-x: auto; }
  #conteudo pre code { padding: 0; background: none; }
  #conteudo a { color: var(--accent); }
  #conteudo a.ind { text-decoration: none; }
  #conteudo a.ind code { color: var(--accent); background: var(--accent-bg); cursor: pointer; }
  #conteudo a.ind:hover code { background: color-mix(in srgb, var(--accent-bg) 70%, var(--accent)); text-decoration: underline; }
  #conteudo iframe.doc { width: 100%; height: 80vh; border: 1px solid var(--line); border-radius: 10px; }
  #conteudo img.doc { max-width: 100%; height: auto; border-radius: 10px; }

  table { border-collapse: separate; border-spacing: 0; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; font-size: .9rem; margin: .8rem 0; }
  td, th { border-bottom: 1px solid var(--line); border-right: 1px solid var(--line); padding: .45rem .8rem; text-align: left; vertical-align: top; }
  tr > :last-child { border-right: 0; } tbody tr:last-child > *, table tr:last-child > td { border-bottom: 0; }
  th { background: var(--bg); font-size: .76rem; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  table.notas { margin: .8rem 0 1.2rem; } table.notas th, table.notas td { text-align: center; }
  table.notas td { font-size: 1.3rem; font-weight: 700; }

  #conteudo strong.leg-amarelo { background: #e5d9a3; border-radius: 4px; padding: 0 .15rem; border-bottom: 2px solid #c9b45a; }
  #conteudo mark.rep { cursor: help; color: inherit; border-radius: 4px; padding: 0 .15rem; }
  #conteudo mark.rep-prod { background: #c6e2b9; border-bottom: 2px solid #5f9e48; }
  #conteudo mark.rep-pert { background: #bfd8ef; border-bottom: 2px solid #4a86b8; }
  #conteudo mark.rep-colet { background: #f9e4cb; border-bottom: 2px solid #e2a96a; }
  #conteudo mark.rep-bolso { background: transparent; padding: 0; border-radius: 0; text-decoration: underline dotted 2px; text-underline-offset: 3px; }
  #conteudo mark.c4 { cursor: help; background: #e3b9cc; color: inherit; border-radius: 4px; padding: 0 .15rem; border-bottom: 2px solid #c0568a; }
  #conteudo strong[data-corr] { cursor: help; background: #e5d9a3; border-radius: 4px; padding: 0 .15rem; }
  #balao { position: fixed; z-index: 20; display: none; max-width: 340px; background: #4a515c; color: #eceef1; padding: .5rem .75rem;
           border-radius: 10px; font-size: .85rem; line-height: 1.35; pointer-events: none; box-shadow: 0 8px 24px rgba(40,48,60,.3); }
  #balao small { display: block; color: #b9bfc9; margin-bottom: .15rem; }

  /* ---------- Modal ---------- */
  /* ---------- Texto transcrito justificado ---------- */
  #conteudo p.transc { margin: 0 auto 1rem; }
  #conteudo p.transc .lt { text-align: justify; text-align-last: justify; }
  #conteudo p.transc .lt:last-child, #conteudo p.transc .lt.longa { text-align-last: left; }

  /* ---------- Sanfonas dentro da correção ---------- */
  #conteudo details.bloco { margin: 1rem 0; background: var(--surface-2); border: 1px solid var(--line); border-left-width: 4px; border-radius: 12px; }
  #conteudo details.bloco.pos { border-left-color: var(--ok); }
  #conteudo details.bloco.neg { border-left-color: var(--danger); }
  #conteudo details.bloco.leituras { border-left-color: var(--cs); }
  #conteudo details.bloco > summary { cursor: pointer; list-style: none; display: flex; align-items: center; justify-content: space-between;
                                      padding: .6rem 1rem; font-weight: 700; font-size: .82rem; letter-spacing: .05em; text-transform: uppercase; }
  #conteudo details.bloco > summary::-webkit-details-marker { display: none; }
  #conteudo details.bloco > summary::after { content: "›"; color: var(--muted); font-size: 1.2rem; transition: transform .2s; }
  #conteudo details.bloco[open] > summary::after { transform: rotate(90deg); }
  #conteudo details.bloco.comp { border-left-color: var(--accent); }
  #conteudo details.bloco.comp > summary { text-transform: none; letter-spacing: 0; font-size: 1.02rem; gap: .6rem; }
  #conteudo details.bloco.comp > summary .tit { flex: 1; }
  #conteudo details.bloco.comp > summary .nota { background: var(--accent-bg); color: var(--accent); border-radius: 999px; padding: 0 .7rem; font-size: .85rem; }
  #conteudo details.bloco .corpo { padding: 0 1.1rem .8rem; }
  #conteudo details.bloco .corpo > :first-child { margin-top: 0; }
  #conteudo details.bloco .corpo > :last-child { margin-bottom: 0; }

  #modal { position: fixed; inset: 0; background: rgba(90,98,110,.45); backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; z-index: 10; }
  #modal.aberto { display: flex; }
  #modal .caixa { background: var(--surface); border-radius: 18px; width: min(600px, 92vw); max-height: 82vh; display: flex; flex-direction: column; box-shadow: 0 24px 60px rgba(40,48,60,.35); overflow: hidden; }
  #modal .cab { padding: 1.1rem 1.4rem; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: .6rem; }
  #modal h2 { margin: 0; font-size: 1.1rem; }
  #modal .contagem { background: var(--accent-bg); color: var(--accent); font-weight: 700; font-size: .8rem; border-radius: 999px; padding: 0 .6rem; }
  #modal .lista { overflow-y: auto; padding: .4rem .8rem .8rem; }
  #modal h3 { font-size: .75rem; text-transform: uppercase; letter-spacing: .05em; margin: .9rem .5rem .3rem; color: var(--muted); }
  #modal .lista a { display: flex; align-items: baseline; gap: .55rem; padding: .45rem .6rem; color: var(--text); text-decoration: none; border-radius: 10px; font-size: .92rem; }
  #modal .lista a:hover { background: var(--surface-2); }
  #modal .lista .num { font-weight: 600; font-variant-numeric: tabular-nums; color: var(--muted); flex: none; }
  #modal .lista .nome { font-weight: 600; }
  #modal .lista .tema { color: var(--muted); font-size: .8rem; margin-left: auto; text-align: right; }
  #modal .vazio { text-align: center; color: var(--muted); padding: 2rem 1rem; }
  #modal .rodape { padding: .8rem 1.4rem; border-top: 1px solid var(--line); display: flex; justify-content: space-between; gap: .5rem; background: var(--bg-side); }
  #modal button { padding: .4rem 1rem; cursor: pointer; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-size: .88rem; }
  #modal button:hover { background: var(--surface-2); }
  #modal button.primario { background: var(--accent); border-color: var(--accent); color: #eef0ff; }
  #modal button.primario:hover { background: #4a5ec0; }
  #modal button:disabled { opacity: .45; cursor: default; }

  #veu { display: none; }
  #fechar-menu { display: none; place-items: center; margin-left: auto; width: 34px; height: 34px; border: 1px solid var(--line);
                 border-radius: 10px; background: var(--surface); font-size: 1rem; }

  /* ---------- Celular: menu vira gaveta sobre o conteúdo ---------- */
  @media screen and (max-width: 760px) {
    html, body, #area { height: 100dvh; }
    #sidebar { position: fixed; top: 0; left: 0; z-index: 15; width: min(320px, 86vw); height: 100dvh; margin-left: 0;
               transform: translateX(-105%); transition: transform .25s ease; box-shadow: 0 0 40px rgba(40,48,60,.35); }
    body.colapsada #sidebar { margin-left: 0; }
    body.menu-aberto #sidebar { transform: none; }
    #veu { display: block; position: fixed; inset: 0; z-index: 14; background: rgba(60,66,76,.45);
           opacity: 0; pointer-events: none; transition: opacity .25s; }
    body.menu-aberto #veu { opacity: 1; pointer-events: auto; }
    #topo { padding: .5rem .6rem; gap: .4rem; }
    #borda { display: none; }
    #toggle { display: inline-block; }
    #toggle, #pendentes, #home, #imprimir { padding: .35rem .7rem; }
    #pills { margin-left: 0; padding-left: 0; border-left: 0; flex-wrap: wrap; width: 100%; }
    #conteudo { margin: .6rem .5rem 0; padding: 1rem .9rem 1.2rem; overflow-wrap: break-word; }
    #conteudo h1 { font-size: 1.35rem; }
    #conteudo table { display: block; max-width: 100%; overflow-x: auto; }
    /* Tabelas com rótulos viram cartões: uma linha por cartão, cada célula com o nome da coluna */
    #conteudo table.cartoes { display: block; border: 0; border-radius: 0; overflow: visible; }
    #conteudo table.cartoes thead { display: none; }
    #conteudo table.cartoes tbody, #conteudo table.cartoes tr, #conteudo table.cartoes td { display: block; }
    #conteudo table.cartoes tr { border: 1px solid var(--line); border-radius: 10px; margin-bottom: .6rem; background: var(--surface); overflow: hidden; }
    #conteudo table.cartoes td { border-right: 0; padding: .35rem .7rem; }
    #conteudo table.cartoes tr > td:last-child { border-bottom: 0; }
    #conteudo table.cartoes td::before { content: attr(data-rotulo); display: block; font-size: .68rem; font-weight: 700;
                                         text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
    #conteudo table.notas { display: table; width: 100%; table-layout: fixed; }
    table.notas th, table.notas td { padding: .4rem .15rem; }
    table.notas th { font-size: .62rem; letter-spacing: 0; }
    table.notas td { font-size: 1.05rem; }
    #fechar-menu { display: grid; }
    #conteudo details.bloco > summary { padding: .55rem .7rem; }
    #conteudo details.bloco .corpo { padding: 0 .7rem .7rem; }
    #conteudo p.transc .lt { text-align-last: left; }
    #balao { max-width: calc(100vw - 16px); }
  }

  /* ---------- Impressão: só o conteúdo da correção ---------- */
  @media print {
    @page { size: A4 portrait; margin: 15mm 18mm; }
    html, body, #area { height: auto !important; overflow: visible !important; display: block !important; background: #fff !important; }
    #sidebar, #borda, #veu, #topo, #balao { display: none !important; }
    #rolagem { overflow: visible !important; }
    #rolagem::after { display: none !important; }
    html, body { width: auto !important; margin: 0 !important; padding: 0 !important; }
    #area, #rolagem { width: 100% !important; max-width: 100% !important; margin: 0 !important; padding: 0 !important; }
    #conteudo { width: 100% !important; max-width: 100% !important; margin: 0 !important; padding: 0 !important; box-shadow: none !important; border: 0; border-radius: 0; background: #fff; overflow-wrap: break-word; }
    #conteudo * { max-width: 100%; }
    #conteudo table { width: 100% !important; table-layout: fixed; }
    #conteudo td, #conteudo th { overflow-wrap: anywhere; }
    #conteudo pre { white-space: pre-wrap; }
    #conteudo details.bloco > summary::after { display: none; }
    #conteudo details.bloco { background: #fff; }
    #conteudo details.bloco > summary { break-after: avoid; }
    #conteudo tr, #conteudo blockquote, #conteudo li { break-inside: avoid; }
    #conteudo table { background: #fff; }
    #conteudo th { background: #eceef2 !important; }
    #conteudo h1, #conteudo h2, #conteudo h3 { break-after: avoid; }
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }

  ::-webkit-scrollbar { width: 10px; } ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 10px; border: 2px solid transparent; background-clip: content-box; }
</style>
</head>
<body>
<aside id="sidebar">
  <div class="marca"><div class="logo">C</div><h1>Correções</h1><button id="fechar-menu" type="button" title="Fechar menu" aria-label="Fechar menu">✕</button></div>
  <input id="busca" type="search" placeholder="Buscar por nome, número, tema…" autocomplete="off" aria-label="Buscar redação">
  <button id="ocultar-lidas" type="button" aria-pressed="false" title="Esconder da lista as redações já lidas">Ocultar lidas<span class="estado">off</span></button>
  <p id="msg-busca">Nenhum resultado.</p>
  <details name="sanfona" open><summary>Redações</summary><p id="msg-lidas">Todas as redações foram lidas.</p><div id="lista-redacoes"></div></details>
  <details name="sanfona"><summary>Propostas</summary><ul id="lista-propostas" class="arq"></ul></details>
  <details name="sanfona"><summary>Agentes</summary><ul id="lista-agentes" class="arq"></ul></details>
</aside>
<button id="borda" type="button" title="Recolher/expandir menu" aria-label="Recolher/expandir menu">«</button>
<div id="veu"></div>
<div id="area">
  <div id="topo"><button id="toggle" title="Mostrar/ocultar menu">☰ Menu</button>
  <button id="home" title="Voltar ao início">⌂ Home</button>
  <button id="pendentes" title="Redações ainda não conferidas">Pendentes<span class="badge" id="badge"></span></button>
  <button id="imprimir" title="Imprimir esta correção">🖨 Imprimir</button>
  <span id="pills"></span></div>
  <div id="rolagem"><main id="conteudo"><em>Selecione um arquivo.</em></main></div>
</div>

<div id="balao"></div>
<div id="modal"><div class="caixa">
  <div class="cab"><h2>Redações não conferidas</h2><span class="contagem" id="modal-contagem"></span></div>
  <div class="lista" id="modal-lista"></div>
  <div class="rodape">
    <button id="marcar-todas" class="primario">✓ Marcar todas como lidas</button>
    <button id="modal-fechar">Fechar</button>
  </div>
</div></div>

<script>
// Lista vem de correcoes/index.json (rode gerar-indice.py ao adicionar correções).
const grupos = [
  ["CC", "Correções completas (CC)"],
  ["CS", "Correções simplificadas (CS)"],
];

const CHAVE = "conferidas";
function lerConferidas() {
  try { return new Set(JSON.parse(localStorage.getItem(CHAVE) || "[]")); } catch { return new Set(); }
}
function salvarConferidas(set) {
  try { localStorage.setItem(CHAVE, JSON.stringify([...set])); } catch {}
}

const modal = document.getElementById("modal");
const fecharModal = () => modal.classList.remove("aberto");
document.getElementById("modal-fechar").onclick = fecharModal;
modal.onclick = e => { if (e.target === modal) fecharModal(); };
document.addEventListener("keydown", e => { if (e.key === "Escape") fecharModal(); });
document.getElementById("pendentes").onclick = () => abrirPendentes(true);

function todasLinks() { return [...document.querySelectorAll("#lista-redacoes a")]; }

function atualizarBadge() {
  const conf = lerConferidas();
  const n = todasLinks().filter(a => !conf.has(a.dataset.caminho)).length;
  const b = document.getElementById("badge");
  b.textContent = n || "✓";
  b.classList.toggle("zero", !n);
  atualizarTodasLidas();
}

function marcarTodas() {
  const conf = lerConferidas();
  for (const a of todasLinks()) { conf.add(a.dataset.caminho); a.parentElement.classList.add("conferida"); }
  salvarConferidas(conf);
  atualizarBadge();
  abrirPendentes(true);
}
document.getElementById("marcar-todas").onclick = marcarTodas;

function abrirPendentes(forcar) {
  const conf = lerConferidas();
  const alvo = document.getElementById("modal-lista");
  alvo.innerHTML = "";
  let total = 0;
  for (const [label, titulo] of grupos) {
    const itens = todasLinks().filter(a => a.dataset.label === label && !conf.has(a.dataset.caminho));
    if (!itens.length) continue;
    total += itens.length;
    const h = document.createElement("h3");
    h.textContent = titulo;
    alvo.appendChild(h);
    for (const a of itens) {
      const l = document.createElement("a");
      l.href = a.href;
      for (const cls of ["num", "nome", "tema"]) {
        const o = a.querySelector("." + cls);
        if (o) { const e = document.createElement("span"); e.className = cls; e.textContent = o.textContent; l.appendChild(e); }
      }
      if (!l.children.length) l.textContent = a.textContent;
      l.onclick = e => { e.preventDefault(); fecharModal(); mostrar(a.dataset.caminho); };
      alvo.appendChild(l);
    }
  }
  document.getElementById("modal-contagem").textContent = total;
  document.getElementById("modal-contagem").style.display = total ? "" : "none";
  document.getElementById("marcar-todas").disabled = !total;
  if (!total) {
    if (!forcar) return;
    alvo.innerHTML = '<div class="vazio">🎉 Todas as redações foram conferidas.</div>';
  }
  modal.classList.add("aberto");
}

// Menu: no computador, recolhe a barra lateral (e lembra a escolha); no celular, abre como gaveta sobre o conteúdo.
const telaPequena = matchMedia("(max-width: 760px)");
function atualizarBotaoMenu() {
  const aberto = telaPequena.matches ? document.body.classList.contains("menu-aberto") : !document.body.classList.contains("colapsada");
  const b = document.getElementById("toggle");
  b.textContent = aberto ? "✕ Menu" : "☰ Menu";
  b.setAttribute("aria-expanded", String(aberto));
  const bd = document.getElementById("borda");
  bd.textContent = aberto ? "«" : "»";
  bd.title = aberto ? "Recolher menu" : "Expandir menu";
}
function alternarMenu() {
  if (telaPequena.matches) document.body.classList.toggle("menu-aberto");
  else {
    const col = document.body.classList.toggle("colapsada");
    try { localStorage.setItem("menuRecolhido", col ? "1" : "0"); } catch {}
  }
  atualizarBotaoMenu();
}
function fecharMenuCelular() {
  if (!document.body.classList.contains("menu-aberto")) return;
  document.body.classList.remove("menu-aberto");
  atualizarBotaoMenu();
}
try { if (localStorage.getItem("menuRecolhido") === "1") document.body.classList.add("colapsada"); } catch {}
document.getElementById("toggle").onclick = alternarMenu;
document.getElementById("borda").onclick = alternarMenu;
// Imprimir: abre todos os blocos recolhidos só durante a impressão e restaura depois.
let abertosAntes = null;
window.addEventListener("beforeprint", () => {
  const ds = [...document.querySelectorAll("#conteudo details")];
  abertosAntes = ds.map(d => [d, d.open]);
  ds.forEach(d => d.open = true);
});
window.addEventListener("afterprint", () => { (abertosAntes || []).forEach(([d, o]) => d.open = o); abertosAntes = null; });
document.getElementById("imprimir").onclick = () => window.print();
document.getElementById("veu").onclick = fecharMenuCelular;
document.getElementById("fechar-menu").onclick = fecharMenuCelular;
document.addEventListener("keydown", e => { if (e.key === "Escape") fecharMenuCelular(); });
telaPequena.addEventListener("change", () => { document.body.classList.remove("menu-aberto"); atualizarBotaoMenu(); });
atualizarBotaoMenu();

function marcarAtivo(caminho) {
  document.querySelectorAll("#sidebar a").forEach(a => {
    const ativo = a.dataset.caminho === caminho;
    a.classList.toggle("ativo", ativo);
    a.parentElement.classList.toggle("atual", ativo);
    if (ativo) for (let d = a.closest("details"); d; d = d.parentElement.closest("details")) d.open = true;
  });
}

// Uma sanfona aberta por vez (reforça o atributo name="sanfona" em navegadores antigos).
document.querySelectorAll("#sidebar > details").forEach(d => d.addEventListener("toggle", () => {
  if (d.open) document.querySelectorAll("#sidebar > details").forEach(o => { if (o !== d) o.open = false; });
}));

// Pill "Ocultar lidas" (on/off, lembrado no navegador)
const pillLidas = document.getElementById("ocultar-lidas");
function aplicarOcultar(ligado) {
  document.body.classList.toggle("ocultar-lidas", ligado);
  pillLidas.setAttribute("aria-pressed", ligado);
  pillLidas.querySelector(".estado").textContent = ligado ? "on" : "off";
  atualizarTodasLidas();
}
function atualizarTodasLidas() {
  const links = todasLinks(), conf = lerConferidas();
  document.body.classList.toggle("todas-lidas", links.length > 0 && links.every(a => conf.has(a.dataset.caminho)));
}
pillLidas.onclick = () => {
  const ligado = !document.body.classList.contains("ocultar-lidas");
  aplicarOcultar(ligado);
  try { localStorage.setItem("ocultarLidas", ligado ? "1" : "0"); } catch {}
};
try { aplicarOcultar(localStorage.getItem("ocultarLidas") === "1"); } catch { aplicarOcultar(false); }

// Home: volta à tela inicial
document.getElementById("home").onclick = () => {
  fecharMenuCelular();
  document.getElementById("conteudo").innerHTML = "<em>Selecione um arquivo.</em>";
  document.getElementById("pills").innerHTML = "";
  document.getElementById("rolagem").scrollTop = 0;
  marcarAtivo(null);
  history.pushState(null, "", location.pathname + location.search);
};

// Agentes: itens `TÍTULO` do ÍNDICE viram links que rolam até a seção de mesmo título.
function linksIndice(c) {
  const sem = t => t.normalize("NFD").replace(/\p{M}/gu, "").toLowerCase().replace(/\s+/g, " ").trim();
  const hs = [...c.querySelectorAll("h1, h2, h3, h4")];
  const idx = hs.find(h => /^(índice|indice|sumário|sumario)\b/i.test(h.textContent.trim()));
  if (!idx) return;
  const rol = document.getElementById("rolagem");
  for (let e = idx.nextElementSibling; e && !/^H[12]$/.test(e.tagName); e = e.nextElementSibling) {
    for (const code of e.querySelectorAll("code")) {
      const chave = sem(code.textContent);
      const alvo = hs.find(h => h !== idx && sem(h.textContent).startsWith(chave));
      if (!alvo) continue;
      const a = document.createElement("a");
      a.href = "#"; a.className = "ind"; a.title = "Ir para a seção";
      a.onclick = ev => { ev.preventDefault();
        rol.scrollTo({ top: rol.scrollTop + alvo.getBoundingClientRect().top - rol.getBoundingClientRect().top, behavior: "smooth" }); };
      code.replaceWith(a); a.appendChild(code);
    }
  }
}

// Propostas e agentes: md é renderizado; pdf e imagem aparecem na própria página
async function abrirArquivo(caminho) {
  fecharMenuCelular();
  const c = document.getElementById("conteudo");
  const url = caminho.split("/").map(encodeURIComponent).join("/");
  document.getElementById("pills").innerHTML = "";
  c.innerHTML = "";
  if (/\.md$/i.test(caminho)) {
    c.innerHTML = marked.parse(await (await fetch(url)).text());
    linksIndice(c);
    rotularTabelas(c);
  } else {
    const link = document.createElement("p");
    const a = document.createElement("a");
    a.href = url; a.target = "_blank"; a.rel = "noopener"; a.textContent = "Abrir em nova aba";
    link.appendChild(a);
    const doc = document.createElement(/\.pdf$/i.test(caminho) ? "iframe" : "img");
    doc.className = "doc"; doc.src = url;
    c.append(link, doc);
  }
  document.getElementById("rolagem").scrollTop = 0;
  marcarAtivo(caminho);
  history.replaceState(null, "", "#" + encodeURIComponent(caminho));
}
const abrir = caminho => caminho.startsWith("correcoes/") ? mostrar(caminho) : abrirArquivo(caminho);

// Transpõe a tabela "Competência | Nota" para horizontal, logo abaixo do Status.
function notasHorizontais(c) {
  const orig = [...c.querySelectorAll("table")].find(t => {
    const h = [...t.querySelectorAll("th")].map(x => x.textContent.trim());
    return h.length === 2 && /^compet/i.test(h[0]) && /^nota/i.test(h[1]);
  });
  if (!orig) return;
  const linhas = [...orig.querySelectorAll("tbody tr")].map(tr => [...tr.cells]);
  const t = document.createElement("table");
  t.className = "notas";
  const cab = t.createTHead().insertRow(), corpo = t.createTBody().insertRow();
  for (const [comp, nota] of linhas) {
    const th = document.createElement("th");
    th.innerHTML = comp.innerHTML;
    cab.appendChild(th);
    corpo.insertCell().innerHTML = nota.innerHTML;
  }
  const status = [...c.querySelectorAll("p, h2")].find(e => /^\s*(\d+\.\s*)?status/i.test(e.textContent));
  if (!status) return;
  let ponto = status;
  if (status.tagName === "H2") {           // status em seção própria: inserir ao fim dela
    while (ponto.nextElementSibling && ponto.nextElementSibling.tagName !== "H2") ponto = ponto.nextElementSibling;
  }
  const prev = orig.previousElementSibling;
  if (prev && prev.tagName === "H2" && /nota/i.test(prev.textContent)) prev.remove();
  orig.remove();
  ponto.after(t);
}

const norm = t => t.toLowerCase().replace(/[“”"'‘’]/g, "").replace(/(\p{L})-\s+(?=\p{L})/gu, "$1").replace(/\.\.\.|…|\[\.\.\.\]/g, " ")
  .replace(/\(sem[^)]*\)/g, "").replace(/\s+/g, " ").trim();

// Lê as tabelas da C1: { trecho, tipo, corr, ini, fim }
function lerDesviosC1(c) {
  const h2c1 = [...c.querySelectorAll("h2")].find(h => /^C1\b/i.test(h.textContent.trim()));
  if (!h2c1) return [];
  const rows = [];
  for (let e = h2c1.nextElementSibling; e && e.tagName !== "H2"; e = e.nextElementSibling) {
    if (e.tagName !== "TABLE") continue;
    const cab = [...e.querySelectorAll("th")].map(x => x.textContent.trim().toLowerCase());
    const iT = cab.findIndex(x => x.startsWith("trecho")), iL = cab.findIndex(x => x.startsWith("linha"));
    const iE = cab.findIndex(x => x.startsWith("tipo")), iC = cab.findIndex(x => x.startsWith("corre"));
    if (iT < 0 || iC < 0) continue;
    for (const tr of e.querySelectorAll("tbody tr")) {
      const m = (tr.cells[iL] ? tr.cells[iL].textContent : "").match(/(\d+)(?:\s*[-–]\s*L?(\d+))?/);
      rows.push({ trecho: norm(tr.cells[iT].textContent), tipo: iE >= 0 ? tr.cells[iE].textContent.trim() : "",
                  corr: tr.cells[iC].textContent.trim(),
                  ini: m ? +m[1] : null, fim: m ? +(m[2] || m[1]) : null });
    }
  }
  return rows;
}

function linhaDe(el) {
  let txt = "";
  for (let n = el.previousSibling; n; n = n.previousSibling) {
    if (n.nodeName === "STRONG") txt = n.textContent + txt; else txt = (n.textContent || "") + txt;
    const m = [...txt.matchAll(/L(\d+):/g)];
    if (m.length) return +m[m.length - 1][1];
  }
  return null;
}

function anotarNegritos(c) {
  const legC1 = [...c.querySelectorAll("p")].find(p => /^\s*Em\s+negrito/i.test(p.textContent));
  const sgC1 = legC1 && legC1.querySelector("strong");
  if (sgC1) sgC1.classList.add("leg-amarelo");
  const rows = lerDesviosC1(c);
  const h = [...c.querySelectorAll("h2")].find(x => /texto transcrito/i.test(x.textContent));
  if (!rows.length || !h) return;
  for (let e = h.nextElementSibling; e && e.tagName !== "H2"; e = e.nextElementSibling) {
    for (const st of e.querySelectorAll("strong")) {
      const s = norm(st.textContent).replace(/^-|-$/g, "");
      if (!s) continue;
      const ln = linhaDe(st);
      let melhor = null, pont = 0;
      for (const r of rows) {
        if (!r.trecho) continue;
        let p = 0;
        if (r.trecho.includes(s)) p = 1 + s.length / r.trecho.length;
        else if (s.includes(r.trecho)) p = 1 + r.trecho.length / s.length;
        else continue;
        if (ln != null && r.ini != null && ln >= r.ini - 1 && ln <= r.fim + 1) p += 2;
        if (p > pont) { pont = p; melhor = r; }
      }
      if (melhor) { st.dataset.corr = melhor.corr; st.dataset.tipo = melhor.tipo; }
    }
  }
}


// C4: destaca em rosa, no texto transcrito, os trechos citados nos pontos de comentário da C4
// (formato: "P1, L7 - **título**.  Em "trecho" --> orientação")
function textoComBr(el) {
  let t = "";
  for (const n of el.childNodes) t += n.nodeName === "BR" ? "\n" : n.textContent;
  return t;
}

function anotarC4(c) {
  const h4 = [...c.querySelectorAll("h2")].find(h => /^C4\b/i.test(h.textContent.trim()));
  const ht = [...c.querySelectorAll("h2")].find(x => /texto transcrito/i.test(x.textContent));
  if (!h4 || !ht) return;
  const pontos = [];
  for (let e = h4.nextElementSibling; e && e.tagName !== "H2"; e = e.nextElementSibling) {
    if (e.tagName !== "P") continue;
    const m = textoComBr(e).match(/^\s*(.*?)\s+-\s+(.+?)\.?\s*\n\s*Em\s+([\s\S]*?)\s*-->\s*([\s\S]*)$/);
    if (!m) continue;
    const linhas = [];
    for (const l of m[1].matchAll(/L(\d+)(?:\s*[-–]\s*L?(\d+))?/g)) linhas.push([+l[1], +(l[2] || l[1])]);
    const trechos = [];
    for (const q of m[3].matchAll(/["“]([^"”]+)["”]\s*(\(([^)]*)\))?/g)) {
      const ls = [...(q[3] || "").matchAll(/L(\d+)(?:\s*[-–]\s*L?(\d+))?/g)].map(l => [+l[1], +(l[2] || l[1])]);
      for (const parte of q[1].split(/\.\.\.|…|\[\.\.\.\]/)) if (parte.trim().length > 1) trechos.push({ txt: parte.trim(), linhas: ls.length ? ls : linhas });
    }
    if (trechos.length) pontos.push({ titulo: m[2].replace(/\*/g, "").trim(), orient: m[4].trim(), trechos });
  }
  if (!pontos.length) return;
  const esc = w => w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  let marcou = false;
  for (let e = ht.nextElementSibling; e && e.tagName !== "H2"; e = e.nextElementSibling) {
    if (e.tagName !== "P") continue;
    const partes = [], walker = document.createTreeWalker(e, NodeFilter.SHOW_TEXT);
    let full = "";
    for (let n = walker.nextNode(); n; n = walker.nextNode()) {
      partes.push({ node: n, ini: full.length, fim: full.length + n.data.length });
      full += n.data + " ";
    }
    const achados = [];
    for (const pt of pontos) for (const t of pt.trechos) {
      const re = new RegExp(t.txt.split(/\s+/).map(esc).join("\\s+(?:L\\d+:\\s*)?"), "gi");
      for (const m of full.matchAll(re)) {
        const ult = [...full.slice(0, m.index).matchAll(/L(\d+):/g)].pop();
        const ln = ult ? +ult[1] : null;
        if (t.linhas.length && ln != null && !t.linhas.some(([a, b]) => ln >= a - 1 && ln <= b + 1)) continue;
        achados.push({ ini: m.index, fim: m.index + m[0].length, pt });
      }
    }
    achados.sort((a, b) => b.ini - a.ini);
    let limite = Infinity;
    for (const a of achados) {
      if (a.fim > limite) continue;      // sobreposição: mantém o primeiro
      limite = a.ini;
      for (const pe of [...partes].reverse()) {
        const ini = Math.max(a.ini, pe.ini), fim = Math.min(a.fim, pe.fim);
        if (ini >= fim) continue;
        let nodo = pe.node;
        if (fim - pe.ini < nodo.data.length) nodo.splitText(fim - pe.ini);
        if (ini - pe.ini > 0) nodo = nodo.splitText(ini - pe.ini);
        const mk = document.createElement("mark");
        mk.className = "c4"; mk.dataset.corr = a.pt.orient; mk.dataset.tipo = "C4 · " + a.pt.titulo;
        nodo.replaceWith(mk); mk.appendChild(nodo);
        marcou = true;
      }
    }
  }
  if (marcou) {
    const leg = [...ht.parentNode.querySelectorAll("p")].find(p => /^\s*Em\s+negrito/i.test(p.textContent));
    if (leg) leg.append(" Em ", Object.assign(document.createElement("mark"), { className: "c4", textContent: "rosa" }), ": falhas de coesão (C4).");
  }
}


// C2: destaca no texto transcrito os repertórios transcritos no comentário da C2
// (rótulo em negrito + citação "> P1, L1-5: "trecho"")
const REP_TIPOS = [
  { re: /^repertório produtivo$/i, cls: "rep-prod", nome: "verde", leg: "repertório produtivo" },
  { re: /^só repertório pertinente$/i, cls: "rep-pert", nome: "azul", leg: "repertório pertinente (não produtivo)" },
  { re: /^repertório de bolso$/i, cls: "rep-bolso", nome: "sublinhado pontilhado", leg: "repertório de bolso" },
  { re: /^apenas referências da coletânea$/i, cls: "rep-colet", nome: "laranja", leg: "referência da coletânea" },
];
function anotarRepertorios(c) {
  const h2 = [...c.querySelectorAll("h2")].find(h => /^C2\b/i.test(h.textContent.trim()));
  const ht = [...c.querySelectorAll("h2")].find(x => /texto transcrito/i.test(x.textContent));
  if (!h2 || !ht) return;
  const itens = [];
  let tipo = null;
  for (let e = h2.nextElementSibling; e && e.tagName !== "H2"; e = e.nextElementSibling) {
    if (e.tagName === "P") {
      const sg = e.querySelector(":scope > strong");
      if (sg && norm0(e.textContent) === norm0(sg.textContent)) tipo = REP_TIPOS.find(t => t.re.test(sg.textContent.trim())) || null;
      continue;
    }
    if (e.tagName !== "BLOCKQUOTE" || !tipo) continue;
    const m = e.textContent.trim().match(/^(P\d+[^:"“]*?):\s*["“]([\s\S]*)["”]\s*$/);
    if (!m) continue;
    const ls = [...m[1].matchAll(/L(\d+)(?:\s*[-–]\s*L?(\d+))?/g)].map(l => [+l[1], +(l[2] || l[1])]);
    for (const parte of m[2].split(/\.\.\.|…|\[\.\.\.\]/)) if (parte.trim().length > 1) itens.push({ txt: parte.trim(), linhas: ls, tipo });
  }
  if (!itens.length) return;
  const esc = w => w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  const usados = new Set();
  for (let e = ht.nextElementSibling; e && e.tagName !== "H2"; e = e.nextElementSibling) {
    if (e.tagName !== "P") continue;
    const partes = [], walker = document.createTreeWalker(e, NodeFilter.SHOW_TEXT);
    let full = "";
    for (let n = walker.nextNode(); n; n = walker.nextNode()) {
      partes.push({ node: n, ini: full.length, fim: full.length + n.data.length });
      full += n.data + " ";
    }
    const achados = [];
    for (const it of itens) {
      const re = new RegExp(it.txt.split(/\s+/).map(w => [...w].map(esc).join("(?:-\\s*L\\d+:\\s*)?")).join("\\s+(?:L\\d+:\\s*)?"), "gi");
      for (const m of full.matchAll(re)) {
        const ult = [...full.slice(0, m.index).matchAll(/L(\d+):/g)].pop();
        const ln = ult ? +ult[1] : null;
        if (it.linhas.length && ln != null && !it.linhas.some(([a, b]) => ln >= a - 1 && ln <= b + 1)) continue;
        achados.push({ ini: m.index, fim: m.index + m[0].length, tipo: it.tipo });
      }
    }
    achados.sort((a, b) => b.ini - a.ini);
    let limite = Infinity;
    for (const a of achados) {
      if (a.fim > limite) continue;
      limite = a.ini;
      for (const pe of [...partes].reverse()) {
        const ini = Math.max(a.ini, pe.ini), fim = Math.min(a.fim, pe.fim);
        if (ini >= fim) continue;
        let nodo = pe.node;
        if (fim - pe.ini < nodo.data.length) nodo.splitText(fim - pe.ini);
        if (ini - pe.ini > 0) nodo = nodo.splitText(ini - pe.ini);
        const mk = document.createElement("mark");
        mk.className = "rep " + a.tipo.cls; mk.dataset.corr = "Trecho transcrito no comentário da C2."; mk.dataset.tipo = "C2 · " + a.tipo.leg;
        nodo.replaceWith(mk); mk.appendChild(nodo);
        usados.add(a.tipo);
      }
    }
  }
  const leg = [...ht.parentNode.querySelectorAll("p")].find(p => /^\s*Em\s+negrito/i.test(p.textContent));
  if (leg) for (const t of REP_TIPOS) if (usados.has(t)) {
    const mk = Object.assign(document.createElement("mark"), { className: "rep " + t.cls, textContent: t.cls === "rep-bolso" ? "pontilhado" : t.nome });
    leg.append(t.cls === "rep-bolso" ? " Sublinhado " : " Em ", mk, ": " + t.leg + " (C2).");
  }
}
function norm0(t) { return t.replace(/\s+/g, " ").trim(); }


// ---------- Estrutura da correção: sanfonas e texto justificado ----------
function nosAte(inicio, parar) {
  const out = [];
  for (let e = inicio.nextElementSibling; e && !parar(e); e = e.nextElementSibling) out.push(e);
  return out;
}
function sanfona(titulo, nos, aberta, classe, nota) {
  const d = document.createElement("details");
  d.className = "bloco " + classe; d.open = aberta;
  const sm = document.createElement("summary");
  if (nota) {
    const t = document.createElement("span"); t.className = "tit"; t.textContent = titulo;
    const n = document.createElement("span"); n.className = "nota"; n.textContent = nota;
    sm.append(t, n);
  } else sm.textContent = titulo;
  d.appendChild(sm);
  const corpo = document.createElement("div"); corpo.className = "corpo"; d.appendChild(corpo);
  nos.forEach(n => corpo.appendChild(n));
  return d;
}

// Leituras incertas: vai para logo depois do texto transcrito, em sanfona fechada (vale também para correções antigas).
function sanfonaLeituras(c) {
  const h = [...c.querySelectorAll("h2")].find(x => /^leituras incertas/i.test(x.textContent.trim()));
  if (!h) return;
  const nos = nosAte(h, e => e.tagName === "H2");
  const linhas = nos.reduce((n, e) => n + e.querySelectorAll("tbody tr").length, 0);
  const d = sanfona("Leituras incertas" + (linhas ? " (" + linhas + ")" : ""), nos, false, "leituras");
  const ht = [...c.querySelectorAll("h2")].find(x => /texto transcrito/i.test(x.textContent));
  let ref = null;
  if (ht) { ref = ht.nextElementSibling; while (ref && ref.tagName !== "H2") ref = ref.nextElementSibling; }
  if (!ht || ref === h) h.replaceWith(d);
  else { h.remove(); if (ref) ref.before(d); else c.append(d); }
}

// C4 e C5: PONTOS POSITIVOS/NEGATIVOS e ELEMENTOS PRESENTES/AUSENTES viram sanfonas (positivos/presentes fechadas).
function sanfonasSubsecoes(c) {
  const alvo = /^(pontos (positivos|negativos)|elementos (presentes|ausentes))$/i;
  for (const h2 of [...c.querySelectorAll("h2")]) {
    if (!/^C[45]\b/i.test(h2.textContent.trim())) continue;
    for (let e = h2.nextElementSibling; e && e.tagName !== "H2"; ) {
      if (e.tagName === "H3" && alvo.test(e.textContent.trim())) {
        const titulo = e.textContent.trim();
        const bom = /positivos|presentes/i.test(titulo);
        const nos = nosAte(e, x => /^(H2|H3|HR)$/.test(x.tagName) || (x.tagName === "P" && /^nota\s*:/i.test(x.textContent.trim())));
        const d = sanfona(titulo, nos, !bom, bom ? "pos" : "neg");
        e.replaceWith(d);
        e = d.nextElementSibling;
      } else e = e.nextElementSibling;
    }
  }
}

// Análise por competência: cada C1..C5 (título h2 ou h3) vira uma sanfona, todas fechadas; a nota aparece no resumo.
function sanfonasCompetencias(c) {
  const ehC = h => /^(H2|H3)$/.test(h.tagName) && /^C[1-5]\b/i.test(h.textContent.trim());
  for (const h of [...c.querySelectorAll("h2, h3")]) {
    if (!ehC(h) || h.closest("details")) continue;
    const parar = h.tagName === "H2" ? (x => x.tagName === "H2") : (x => x.tagName === "H2" || ehC(x));
    const nos = nosAte(h, parar);
    const pn = nos.find(e => e.tagName === "P" && /^nota\s*:\s*\d+/i.test(e.textContent.trim()));
    const nota = pn ? pn.textContent.trim().match(/^nota\s*:\s*(\d+)/i)[1] : "";
    const d = sanfona(h.textContent.trim(), nos, false, "comp", nota);
    d.dataset.comp = h.textContent.trim().slice(0, 2).toUpperCase();
    h.replaceWith(d);
  }
}

// Texto transcrito: cada linha da folha vira um bloco justificado, numa coluna com a largura típica da folha.
function justificarTranscricao(c) {
  const ht = [...c.querySelectorAll("h2")].find(x => /texto transcrito/i.test(x.textContent));
  if (!ht) return;
  const ps = nosAte(ht, e => e.tagName === "H2").filter(e => e.tagName === "P" && e.querySelector("br"));
  const grupos = [];
  for (const p of ps) {
    const linhas = [[]];
    for (const n of [...p.childNodes]) { if (n.nodeName === "BR") linhas.push([]); else linhas[linhas.length - 1].push(n); }
    grupos.push([p, linhas.filter(l => l.some(n => n.textContent.trim()))]);
  }
  const tams = grupos.flatMap(([, ls]) => ls.map(l => l.map(n => n.textContent).join("").replace(/^\s*L\d+:\s*/, "").trim().length)).sort((a, b) => a - b);
  if (!tams.length) return;
  const p90 = tams[Math.min(tams.length - 1, Math.floor(tams.length * 0.9))];
  for (const [p, ls] of grupos) {
    p.classList.add("transc");
    p.style.maxWidth = Math.max(40, Math.round((p90 + 6) * 0.95)) + "ch";
    p.textContent = "";
    for (const l of ls) {
      const d = document.createElement("div"); d.className = "lt";
      l.forEach(n => d.appendChild(n));
      if (d.textContent.replace(/^\s*L\d+:\s*/, "").trim().length > p90) d.classList.add("longa");
      p.appendChild(d);
    }
  }
}

const balao = document.getElementById("balao");
const conteudoEl = document.getElementById("conteudo");
conteudoEl.addEventListener("mouseover", e => {
  const st = e.target.closest("strong[data-corr], mark[data-corr]");
  if (!st) return;
  balao.innerHTML = "";
  if (st.dataset.tipo) { const sm = document.createElement("small"); sm.textContent = st.dataset.tipo; balao.appendChild(sm); }
  balao.appendChild(document.createTextNode(st.dataset.corr));
  balao.style.display = "block";
  const r = st.getBoundingClientRect(), b = balao.getBoundingClientRect();
  let x = Math.min(Math.max(8, r.left), window.innerWidth - b.width - 8);
  let y = r.top - b.height - 6;
  if (y < 8) y = r.bottom + 6;
  balao.style.left = x + "px"; balao.style.top = y + "px";
});
conteudoEl.addEventListener("mouseout", e => {
  if (e.target.closest("strong[data-corr], mark[data-corr]")) balao.style.display = "none";
});

// Pills C1..C5 no header da tela: rolam até o título da competência
function pillsCompetencias(c) {
  const rol = document.getElementById("rolagem");
  const alvo = document.getElementById("pills");
  alvo.innerHTML = "";
  const topo = document.createElement("button");
  topo.type = "button"; topo.className = "topo"; topo.textContent = "↑ Topo";
  topo.onclick = () => rol.scrollTo({ top: 0, behavior: "smooth" });
  alvo.appendChild(topo);
  const hs = [...c.querySelectorAll("details.comp, h2, h3")].filter(h => h.matches("details.comp") || /^C[1-5]\b/i.test(h.textContent.trim()));
  for (const h of hs) {
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = h.matches("details.comp") ? h.dataset.comp : h.textContent.trim().slice(0, 2).toUpperCase();
    b.onclick = () => {
      if (h.matches("details")) h.open = true;
      rol.scrollTo({ top: rol.scrollTop + h.getBoundingClientRect().top - rol.getBoundingClientRect().top, behavior: "smooth" });
    };
    alvo.appendChild(b);
  }
}

// Tabelas (exceto a de notas): cada célula recebe o nome da coluna, usado no celular para mostrar a linha como cartão.
function rotularTabelas(c) {
  for (const t of c.querySelectorAll("table:not(.notas)")) {
    const cab = [...t.querySelectorAll("thead th")].map(th => th.textContent.trim());
    if (cab.length < 3) continue;
    t.classList.add("cartoes");
    for (const tr of t.querySelectorAll("tbody tr")) [...tr.children].forEach((td, i) => { td.dataset.rotulo = cab[i] || ""; });
  }
}

async function mostrar(caminho) {
  fecharMenuCelular();
  const r = await fetch(caminho.split("/").map(encodeURIComponent).join("/"));
  const c = document.getElementById("conteudo");
  c.innerHTML = marked.parse(await r.text());
  notasHorizontais(c);
  rotularTabelas(c);
  anotarNegritos(c);
  anotarC4(c);
  anotarRepertorios(c);
  justificarTranscricao(c);
  sanfonasSubsecoes(c);
  sanfonaLeituras(c);
  sanfonasCompetencias(c);
  pillsCompetencias(c);
  document.getElementById("rolagem").scrollTop = 0;
  marcarAtivo(caminho);
  const conf = lerConferidas();
  if (!conf.has(caminho)) { conf.add(caminho); salvarConferidas(conf); }
  todasLinks().forEach(a => {
    if (a.dataset.caminho === caminho) a.parentElement.classList.add("conferida");
  });
  atualizarBadge();
  location.hash = encodeURIComponent(caminho);
}

// Nomes dos arquivos da pasta: index.json; sem ele, tenta a listagem do diretório (servidor local).
async function nomesDe(pasta) {
  try {
    const ri = await fetch(pasta + "/index.json", { cache: "no-store" });
    if (ri.ok) return await ri.json();
  } catch {}
  const r = await fetch(encodeURIComponent(pasta) + "/");
  const doc = new DOMParser().parseFromString(await r.text(), "text/html");
  return [...doc.querySelectorAll("a")].map(a => decodeURIComponent(a.getAttribute("href"))).filter(h => !h.endsWith("/"));
}

// Propostas e agentes: lista simples, sem subpastas (agentes/bak fica de fora).
async function listarArquivos(pasta, idUl, ext) {
  const ul = document.getElementById(idUl);
  const nomes = (await nomesDe(pasta)).filter(n => ext.test(n) && n !== "index.json").sort();
  for (const nome of nomes) {
    const caminho = pasta + "/" + nome;
    const a = document.createElement("a");
    a.href = "#" + encodeURIComponent(caminho);
    a.dataset.caminho = caminho;
    a.textContent = nome.replace(/\.[^.]+$/, "");
    a.title = nome;
    a.onclick = e => { e.preventDefault(); abrirArquivo(caminho); };
    const li = document.createElement("li");
    li.appendChild(a);
    ul.appendChild(li);
  }
}

// Redações agrupadas em sanfonas por tema; temas mais recentes (maior número) primeiro.
async function listar(idLista) {
  const pasta = "correcoes";
  const lista = document.getElementById(idLista);
  const abertos = new Set([...lista.querySelectorAll("details.tema-grupo[open] > summary .tit")].map(t => t.textContent));
  const ativo = lista.querySelector("a.ativo")?.dataset.caminho;
  const primeira = !lista.children.length;
  const grupos = new Map();
  const grupoDe = tema => {
    if (!grupos.has(tema)) {
      const d = document.createElement("details");
      d.className = "tema-grupo";
      const s = document.createElement("summary");
      const t = document.createElement("span"); t.className = "tit"; t.textContent = tema.replace(/-/g, " ");
      const q = document.createElement("span"); q.className = "qtd";
      s.append(t, q);
      d.append(s, document.createElement("ul"));
      grupos.set(tema, d);
    }
    return grupos.get(tema);
  };
  const nomes = await nomesDe(pasta);
  assinaturaCorrecoes = nomes.join("|");
  const arquivos = nomes.filter(h => h.endsWith(".md") && ["CC", "CS"].includes(h.split("_")[1])).sort();
  const conf = lerConferidas();
  for (const nome of arquivos) {
    const li = document.createElement("li");
    const a = document.createElement("a");
    const caminho = pasta + "/" + nome;
    a.href = "#" + encodeURIComponent(caminho);
    a.dataset.caminho = caminho;
    a.dataset.label = nome.split("_")[1];
    const m = nome.replace(/\.md$/, "").match(/^(\d+)_([A-Z]+)_(\d{4}-\d{2}-\d{2})_(.+?)_(.+)$/);
    if (m) {
      const [, num, lab, data, aluno, tema] = m;
      const el = (cls, txt) => { const e = document.createElement("span"); e.className = cls; e.textContent = txt; return e; };
      const l1 = el("linha1", "");
      l1.append(el("num", num), el("nome", aluno.replace(/-/g, " ")), el("tag " + lab, lab));
      a.append(l1, el("tema", tema.replace(/-/g, " ")));
      a.title = nome + " (" + data + ")";
    } else a.textContent = nome.replace(/\.md$/, "");
    a.onclick = e => { e.preventDefault(); mostrar(caminho); };
    li.classList.toggle("conferida", conf.has(caminho));
    li.appendChild(a);
    grupoDe(m ? m[5] : "Outros").querySelector("ul").appendChild(li);
  }
  const ordem = [...grupos.values()].reverse();
  lista.innerHTML = "";
  for (const d of ordem) {
    d.querySelector(".qtd").textContent = d.querySelectorAll("li").length;
    if (abertos.has(d.querySelector(".tit").textContent)) d.open = true;
    lista.appendChild(d);
  }
  if (primeira && ordem.length) ordem[0].open = true;
  if (ativo) lista.querySelectorAll("a").forEach(a => { if (a.dataset.caminho === ativo) { a.classList.add("ativo"); a.parentElement.classList.add("atual"); } });
}
let assinaturaCorrecoes = "";
// Atualiza a lista sozinha quando surge (ou some) uma correção em correcoes/index.json.
setInterval(async () => {
  try {
    const nomes = await nomesDe("correcoes");
    if (nomes.join("|") === assinaturaCorrecoes) return;
    await listar("lista-redacoes");
    atualizarBadge();
    filtrarBusca();
  } catch {}
}, 4000);

// Busca na sidebar: qualquer termo do nome do arquivo (número, tipo, data, aluno, tema), sem acento e sem diferenciar maiúsculas.
// Vários termos: todos precisam aparecer (em qualquer ordem).
const busca = document.getElementById("busca");
const normBusca = t => t.normalize("NFD").replace(/\p{M}/gu, "").toLowerCase().replace(/[_\-.]+/g, " ");
function filtrarBusca() {
  const termos = normBusca(busca.value).split(/\s+/).filter(Boolean);
  const sanfonas = [...document.querySelectorAll("#sidebar > details")];
  for (const d of document.querySelectorAll("#lista-redacoes details.tema-grupo")) {
    const achou = [...d.querySelectorAll("a")].some(a => termos.every(t => normBusca(a.dataset.caminho.split("/").pop().replace(/\.md$/, "")).includes(t)));
    d.classList.toggle("sem-resultado", termos.length > 0 && !achou);
    if (termos.length && achou) d.open = true;
  }
  let total = 0;
  for (const d of sanfonas) {
    let achou = 0;
    for (const a of d.querySelectorAll("a")) {
      const nome = (a.dataset.caminho || a.textContent).split("/").pop().replace(/\.[^.]+$/, "");
      const ok = termos.every(t => normBusca(nome).includes(t));
      a.parentElement.classList.toggle("sem-busca", !ok);
      if (ok) achou++;
    }
    d.classList.toggle("sem-resultado", termos.length > 0 && !achou);
    total += achou;
  }
  document.getElementById("msg-busca").classList.toggle("mostrar", termos.length > 0 && !total);
  const visiveis = sanfonas.filter(d => !d.classList.contains("sem-resultado"));
  if (termos.length && visiveis.length && !visiveis.some(d => d.open)) visiveis[0].open = true;
}
busca.addEventListener("input", filtrarBusca);
busca.addEventListener("keydown", e => { if (e.key === "Escape" && busca.value) { busca.value = ""; filtrarBusca(); } });

Promise.all([
  listar("lista-redacoes"),
  listarArquivos("propostas", "lista-propostas", /\.(pdf|jpe?g|png)$/i),
  listarArquivos("agentes", "lista-agentes", /\.md$/i),
]).then(() => {
  atualizarBadge();
  if (location.hash.length > 1) abrir(decodeURIComponent(location.hash.slice(1)));
  abrirPendentes(false);
}).catch(() => {
  document.getElementById("conteudo").textContent =
    "Erro ao listar. Rode 'python3 -m http.server' nesta pasta e abra http://localhost:8000/";
});
